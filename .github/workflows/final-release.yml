name: Generate Downloadable App Package
on: [push, workflow_dispatch]

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Create Base Project Setup
        run: |
          # Generate clean app directories if missing
          mkdir -p app/src/main/java/com/countmycals
          
          # Move file if placed incorrectly
          if [ -f MainActivity.java ]; then
            mv MainActivity.java app/src/main/java/com/countmycals/MainActivity.java
          fi
          
          # Initialize minimal configuration setup
          cat << 'EOF' > settings.gradle
          rootProject.name = "CountMyCals"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.0.2' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.countmycals'
              compileSdk 33
              defaultConfig {
                  applicationId "com.countmycals"
                  minSdk 24
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          # Install base wrapper system tools
          gradle wrapper --gradle-version 8.0.2
          chmod +x gradlew

      - name: Set up Java Development Kit 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile Official Installer Package
        run: ./gradlew assembleDebug --no-daemon

      - name: Export Downloadable Package File
        uses: actions/upload-artifact@v4
        with:
          name: CountMyCals-Official-App
          path: app/build/outputs/apk/debug/app-debug.apk
